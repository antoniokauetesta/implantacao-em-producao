# EstuLanches - ambiente de produção
#   docker compose up -d --build     -> sobe tudo
#   docker compose ps                -> estado dos serviços e portas
#   docker compose logs              -> auditoria dos logs
#   docker compose --profile test run --rm testes   -> testes unitários + integração
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data   # dados persistem entre reinícios
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]
    # Sem "ports": o banco NÃO é exposto fora da rede Docker (segurança).

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro   # já cadastra o servidor "EstuLanches"
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      NODE_ENV: production
      PORT: "3000"
      RATE_LIMIT: ${RATE_LIMIT:-300}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [interna]

  # Só roda com: docker compose --profile test run --rm testes
  # Usa um schema separado ("test") para NUNCA apagar os dados reais.
  testes:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=test
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

volumes:
  pgdata:
  pgadmin_data:

networks:
  interna:
